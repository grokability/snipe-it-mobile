name: develop-build-submit

on:
  push:
    branches:
      - develop

jobs:
  build_ios:
    name: Build iOS (Internal Testing)
    type: build
    params:
      platform: ios
      profile: internal-testing

  build_android:
    name: Build Android (Internal Testing)
    type: build
    params:
      platform: android
      profile: internal-testing

  submit_ios:
    name: Submit to TestFlight (Internal)
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: internal-testing

  submit_android:
    name: Submit to Play Store (Internal)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal-testing
