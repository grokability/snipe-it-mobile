name: develop-build-submit

on:
  push:
    branches:
      - develop

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Internal Testing)
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: internal-testing

  build_android:
    name: Build Android (Internal Testing)
    type: build
    needs: [get_build_android]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: internal-testing

  submit_ios:
    name: Submit iOS (Internal Testing)
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: internal-testing

  submit_android:
    name: Submit Android (Internal Testing)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal-testing

  publish_ota:
    name: Publish OTA Update (internal-testing)
    needs: [get_build_ios, get_build_android]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Publish update
        run: |
          MSG=$(git log -1 --format=%s)
          EXPO_PUBLIC_UPDATE_MESSAGE="$MSG" npx eas-cli@latest update --branch ${{ github.ref_name }} --message "$MSG" --environment production --non-interactive

  changelog:
    name: 📋 Generate Changelog
    outputs:
      log: ${{ steps.generate.outputs.log }}
    steps:
      - uses: eas/checkout
      - id: generate
        name: Generate git log
        run: |
          LOG=$(git log --format="• %s" $(git merge-base HEAD origin/main)..HEAD --no-merges | head -20)
          set-output log "$LOG"

  notify_native_success:
    name: ✅ Notify — Native Build Distributed
    type: slack
    needs: [changelog]
    after: [submit_ios, submit_android, publish_ota]
    if: ${{ after.submit_ios.status == 'success' && after.submit_android.status == 'success' }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "✅ Snipe IT Mobile — Internal Testing"
          - type: section
            fields:
              - type: mrkdwn
                text: "🔨 *Type:* Native Build"
              - type: mrkdwn
                text: "🌿 *Branch:* develop"
          - type: section
            text:
              type: mrkdwn
              text: "📋 *Changes*\n${{ needs.changelog.outputs.log }}"

  notify_ota_success:
    name: ✅ Notify — OTA Update Published
    type: slack
    needs: [changelog]
    after: [submit_ios, submit_android, publish_ota]
    if: ${{ after.publish_ota.status == 'success' && after.submit_ios.status != 'success' }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "✅ Snipe IT Mobile — Internal Testing"
          - type: section
            fields:
              - type: mrkdwn
                text: "⚡ *Type:* OTA / JS Update"
              - type: mrkdwn
                text: "🌿 *Branch:* develop"
          - type: section
            text:
              type: mrkdwn
              text: "📋 *Changes*\n${{ needs.changelog.outputs.log }}"

  notify_failure:
    name: ❌ Notify — Failure
    type: slack
    after: [build_ios, build_android, submit_ios, submit_android, publish_ota]
    if: ${{ failure() }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "❌ Snipe IT Mobile — Internal Testing Failed"
          - type: section
            fields:
              - type: mrkdwn
                text: "🌿 *Branch:* develop"
          - type: section
            text:
              type: mrkdwn
              text: "📊 *Job Status*\n🍎 iOS build: ${{ after.build_ios.status }} | submit: ${{ after.submit_ios.status }}\n🤖 Android build: ${{ after.build_android.status }} | submit: ${{ after.submit_android.status }}\n⚡ OTA: ${{ after.publish_ota.status }}"
          - type: section
            text:
              type: mrkdwn
              text: "🔗 Check the EAS dashboard for details."
