name: develop-build-submit

on:
  push:
    branches:
      - develop

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  # The release number is app.json's major.minor plus the count of first-parent commits on
  # develop, so each merged PR adds one. testflight and main are fast-forwarded to develop
  # commits, so the same commit gets the same number on every track. It is computed rather
  # than written to app.json because `version` is part of the fingerprint.
  release_info:
    name: Compute Release Number
    runs_on: linux-medium
    outputs:
      release_number: ${{ steps.release.outputs.release_number }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: eas/checkout
      - id: release
        name: Count first-parent commits
        run: |
          # eas/checkout clones with --depth 1, which would make the count 1.
          git fetch --unshallow --quiet
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Checkout is still shallow; the release number would be wrong." >&2
            exit 1
          fi
          MAJOR_MINOR=$(node -p "require('./app.json').expo.version.split('.').slice(0, 2).join('.')")
          COUNT=$(git rev-list --count --first-parent HEAD)
          set-output release_number "$MAJOR_MINOR.$COUNT"
          set-output commit "$(git rev-parse --short HEAD)"

  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Internal Testing)
    type: build
    needs: [get_build_ios, release_info]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    # Inlined into the embedded bundle, so a fresh binary reports the same release as the
    # OTA update from this commit. Env vars are not part of the fingerprint.
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: ios
      profile: internal-testing

  build_android:
    name: Build Android (Internal Testing)
    type: build
    needs: [get_build_android, release_info]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: android
      profile: internal-testing

  submit_ios:
    name: Submit iOS (Internal Testing)
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: internal-testing

  submit_android:
    name: Submit Android (Internal Testing)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: internal-testing

  publish_ota:
    name: Publish OTA Update (internal-testing)
    needs: [get_build_ios, get_build_android, release_info]
    environment: production
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Publish update
        run: |
          MSG="$EXPO_PUBLIC_RELEASE_NUMBER ($EXPO_PUBLIC_UPDATE_COMMIT)"
          npx eas-cli@latest update --branch ${{ github.ref_name }} --message "$MSG" --environment production --non-interactive
      - name: Upload source maps to Sentry
        # eas update exports into ./dist and always passes --dump-sourcemap, so the maps are
        # already sitting there. Native builds upload via the config plugin; OTA updates do
        # not, and most releases here are OTA — without this their stack traces stay minified.
        # Sentry matches maps to events by debug ID rather than by release, so a failure here
        # leaves the update live and re-runnable rather than needing a republish.
        # The binary ships with @sentry/react-native, so it is version-matched to the SDK.
        # The scoped form in Sentry's docs is not linked into node_modules here and would
        # be fetched from npm instead.
        run: npx sentry-expo-upload-sourcemaps dist

  update_deployments_gist:
    name: Update Deployments Gist
    runs_on: linux-medium
    after: [build_ios, build_android, submit_ios, submit_android, publish_ota]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      # eas-cli resolves the app config, and its plugins, before any command that reads the project.
      - uses: eas/install_node_modules
      - name: Rewrite the deployments table
        run: WORKFLOW_NAME=develop-build-submit node scripts/update-deployments-gist.mjs

  notify_native_success:
    name: ✅ Notify — Native Build Distributed
    runs_on: linux-medium
    after: [submit_ios, submit_android, publish_ota]
    if: ${{ after.submit_ios.status == 'success' && after.submit_android.status == 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          # Each develop commit is one PR merge. GitHub writes "Merge pull request #N from <branch>"
          # as the subject and the PR title as the body, and the depth-1 checkout has both. Any
          # other commit, such as merging main back into develop, is shown by its subject.
          SUBJECT=$(git log -1 --format=%s)
          PR_TITLE=$(git log -1 --format=%b | head -n 1)
          PR_NUMBER=$(echo "$SUBJECT" | sed -n 's/^Merge pull request #\([0-9]*\) from .*/\1/p')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg subject "$SUBJECT" \
              --arg pr_title "$PR_TITLE" \
              --arg pr_number "$PR_NUMBER" \
              'def escape: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              (if $pr_number != "" and $pr_title != ""
                then "• " + ($pr_title | escape) + " (<https://github.com/grokability/snipe-it-mobile/pull/" + $pr_number + "|#" + $pr_number + ">)"
                else "• " + ($subject | escape) end) as $change |
              {blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — Internal Testing"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "🔨 *Type:* Native Build"},
                  {type: "mrkdwn", text: "🌿 *Branch:* develop"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Change*\n" + $change)}}
              ]}')"

  notify_ota_success:
    name: ✅ Notify — OTA Update Published
    runs_on: linux-medium
    after: [submit_ios, submit_android, publish_ota]
    if: ${{ after.publish_ota.status == 'success' && after.submit_ios.status != 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          # Each develop commit is one PR merge. GitHub writes "Merge pull request #N from <branch>"
          # as the subject and the PR title as the body, and the depth-1 checkout has both. Any
          # other commit, such as merging main back into develop, is shown by its subject.
          SUBJECT=$(git log -1 --format=%s)
          PR_TITLE=$(git log -1 --format=%b | head -n 1)
          PR_NUMBER=$(echo "$SUBJECT" | sed -n 's/^Merge pull request #\([0-9]*\) from .*/\1/p')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg subject "$SUBJECT" \
              --arg pr_title "$PR_TITLE" \
              --arg pr_number "$PR_NUMBER" \
              'def escape: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              (if $pr_number != "" and $pr_title != ""
                then "• " + ($pr_title | escape) + " (<https://github.com/grokability/snipe-it-mobile/pull/" + $pr_number + "|#" + $pr_number + ">)"
                else "• " + ($subject | escape) end) as $change |
              {blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — Internal Testing"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "⚡ *Type:* OTA / JS Update"},
                  {type: "mrkdwn", text: "🌿 *Branch:* develop"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Change*\n" + $change)}}
              ]}')"

  notify_failure:
    name: ❌ Notify — Failure
    runs_on: linux-medium
    after: [release_info, build_ios, build_android, submit_ios, submit_android, publish_ota]
    if: ${{ failure() }}
    steps:
      - name: Send Slack notification
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg ios_build "${{ after.build_ios.status }}" \
              --arg ios_submit "${{ after.submit_ios.status }}" \
              --arg android_build "${{ after.build_android.status }}" \
              --arg android_submit "${{ after.submit_android.status }}" \
              --arg ota "${{ after.publish_ota.status }}" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "❌ Snipe IT Mobile — Internal Testing Failed"}},
                {type: "section", fields: [{type: "mrkdwn", text: "🌿 *Branch:* develop"}]},
                {type: "section", text: {type: "mrkdwn", text: ("📊 *Job Status*\n🍎 iOS build: " + $ios_build + " | submit: " + $ios_submit + "\n🤖 Android build: " + $android_build + " | submit: " + $android_submit + "\n⚡ OTA: " + $ota)}},
                {type: "section", text: {type: "mrkdwn", text: "🔗 Check the EAS dashboard for details."}}
              ]}')"
