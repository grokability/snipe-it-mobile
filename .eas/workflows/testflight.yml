name: testflight-build-submit

on:
  push:
    branches:
      - testflight

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  # Same computation as develop.yml. testflight only ever holds commits fast-forwarded from
  # develop, so the first-parent count, and the release number, match develop's run.
  release_info:
    name: Compute Release Number
    runs_on: linux-medium
    outputs:
      release_number: ${{ steps.release.outputs.release_number }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: eas/checkout
      - id: release
        name: Count first-parent commits
        run: |
          # eas/checkout clones with --depth 1, which would make the count 1.
          git fetch --unshallow --quiet
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Checkout is still shallow; the release number would be wrong." >&2
            exit 1
          fi
          MAJOR_MINOR=$(node -p "require('./app.json').expo.version.split('.').slice(0, 2).join('.')")
          COUNT=$(git rev-list --count --first-parent HEAD)
          set-output release_number "$MAJOR_MINOR.$COUNT"
          set-output commit "$(git rev-parse --short HEAD)"

  # Only a beta-profile build counts. A develop build with the same fingerprint listens on the
  # `internal-testing` channel, so beta testers who received it would get develop's updates
  # instead of this branch's. A beta build that matches is already on TestFlight and open
  # testing, so there is nothing to distribute.
  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Beta)
    type: build
    needs: [get_build_ios, release_info]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    # Inlined into the embedded bundle, as on develop.
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: ios
      profile: beta

  build_android:
    name: Build Android (Beta)
    type: build
    needs: [get_build_android, release_info]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: android
      profile: beta

  # iOS uses type: testflight rather than type: submit because only the testflight job can
  # create the Beta App Review submission. "Initial Group" is an external group, and an
  # external group's first build on each version has to clear that review, so type: submit
  # left the build sitting at "Ready to Submit" and testers never received it.
  distribute_ios:
    name: Distribute iOS to Initial Group
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
      external_groups: ["Initial Group"]
      submit_beta_review: true

  submit_android:
    name: Submit Android (Beta)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: beta

  publish_ota:
    name: Publish OTA Update (beta)
    needs: [get_build_ios, get_build_android]
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Publish update
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHA=$(git rev-parse --short HEAD)
          MSG="v$VERSION ($SHA)"
          EXPO_PUBLIC_UPDATE_MESSAGE="$MSG" EXPO_PUBLIC_UPDATE_COMMIT="$SHA" npx eas-cli@latest update --branch ${{ github.ref_name }} --message "$MSG" --environment production --non-interactive
      - name: Upload source maps to Sentry
        # eas update exports into ./dist and always passes --dump-sourcemap, so the maps are
        # already sitting there. Native builds upload via the config plugin; OTA updates do
        # not, and most releases here are OTA — without this their stack traces stay minified.
        # Sentry matches maps to events by debug ID rather than by release, so a failure here
        # leaves the update live and re-runnable rather than needing a republish.
        # The binary ships with @sentry/react-native, so it is version-matched to the SDK.
        # The scoped form in Sentry's docs is not linked into node_modules here and would
        # be fetched from npm instead.
        run: npx sentry-expo-upload-sourcemaps dist

  update_deployments_gist:
    name: Update Deployments Gist
    runs_on: linux-medium
    after: [build_ios, build_android, distribute_ios, submit_android, publish_ota]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      # eas-cli resolves the app config, and its plugins, before any command that reads the project.
      - uses: eas/install_node_modules
      - name: Rewrite the deployments table
        run: WORKFLOW_NAME=testflight-build-submit node scripts/update-deployments-gist.mjs

  notify_native_success:
    name: ✅ Notify — Native Build Distributed
    runs_on: linux-medium
    after: [distribute_ios, submit_android, publish_ota]
    if: ${{ after.distribute_ios.status == 'success' && after.submit_android.status == 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          CHANGELOG=$(git log --format="• %s" --no-merges -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="_No new commits_"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg changelog "$CHANGELOG" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — TestFlight / Beta"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "🔨 *Type:* Native Build"},
                  {type: "mrkdwn", text: "🌿 *Branch:* testflight"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Changes*\n" + $changelog)}}
              ]}')"

  notify_ota_success:
    name: ✅ Notify — OTA Update Published
    runs_on: linux-medium
    after: [distribute_ios, submit_android, publish_ota]
    if: ${{ after.publish_ota.status == 'success' && after.distribute_ios.status != 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          CHANGELOG=$(git log --format="• %s" --no-merges -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="_No new commits_"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg changelog "$CHANGELOG" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — TestFlight / Beta"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "⚡ *Type:* OTA / JS Update"},
                  {type: "mrkdwn", text: "🌿 *Branch:* testflight"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Changes*\n" + $changelog)}}
              ]}')"

  notify_failure:
    name: ❌ Notify — Failure
    runs_on: linux-medium
    after: [release_info, build_ios, build_android, distribute_ios, submit_android, publish_ota]
    if: ${{ failure() }}
    steps:
      - name: Send Slack notification
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg ios_build "${{ after.build_ios.status }}" \
              --arg ios_submit "${{ after.distribute_ios.status }}" \
              --arg android_build "${{ after.build_android.status }}" \
              --arg android_submit "${{ after.submit_android.status }}" \
              --arg ota "${{ after.publish_ota.status }}" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "❌ Snipe IT Mobile — TestFlight Failed"}},
                {type: "section", fields: [{type: "mrkdwn", text: "🌿 *Branch:* testflight"}]},
                {type: "section", text: {type: "mrkdwn", text: ("📊 *Job Status*\n🍎 iOS build: " + $ios_build + " | submit: " + $ios_submit + "\n🤖 Android build: " + $android_build + " | submit: " + $android_submit + "\n⚡ OTA: " + $ota)}},
                {type: "section", text: {type: "mrkdwn", text: "🔗 Check the EAS dashboard for details."}}
              ]}')"
