name: testflight-build-submit

on:
  push:
    branches:
      - testflight

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Beta)
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: beta

  build_android:
    name: Build Android (Beta)
    type: build
    needs: [get_build_android]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: beta

  # Path A: existing build found — distribute without re-uploading (develop binary promoted to beta)
  # EAS Submit always re-uploads the binary, which fails when the same build number was already
  # uploaded by the develop workflow. Instead:
  # - iOS uses type: testflight (distributes to groups via ASC API, uses EAS-stored credentials)
  # - Android uses fastlane supply --track_promote_to (promotes without re-uploading)
  distribute_ios_reuse:
    name: Distribute iOS to Initial Group (Reuse)
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    runs_on: linux-medium
    steps:
      - name: Add existing build to Initial Group
        run: |
          fastlane run pilot \
            app_identifier:com.grokability.snipeitmobile \
            api_key_path:"$ASC_API_KEY_JSON" \
            distribute_only:true \
            app_platform:ios \
            build_number:"${{ needs.get_build_ios.outputs.app_build_version }}" \
            app_version:"${{ needs.get_build_ios.outputs.app_version }}" \
            groups:"Initial Group" \
            submit_beta_review:true

  distribute_android_reuse:
    name: Promote Android to Alpha (Reuse)
    needs: [get_build_android]
    if: ${{ needs.get_build_android.outputs.build_id }}
    runs_on: linux-medium
    steps:
      - name: Promote existing build from internal to alpha
        run: |
          fastlane supply \
            --package_name com.grokability.snipeitmobile \
            --track internal \
            --track_promote_to alpha \
            --json_key "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            --changes_not_sent_for_review false \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  # Path B: no existing build — submit the fresh build
  submit_ios_fresh:
    name: Submit iOS (Fresh Build)
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta

  submit_android_fresh:
    name: Submit Android (Fresh Build)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: beta

  publish_ota:
    name: Publish OTA Update (beta)
    needs: [get_build_ios, get_build_android]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Publish update
        run: |
          MSG=$(git log -1 --format=%s)
          EXPO_PUBLIC_UPDATE_MESSAGE="$MSG" npx eas-cli@latest update --branch ${{ github.ref_name }} --message "$MSG" --environment production --non-interactive

  changelog:
    name: 📋 Generate Changelog
    outputs:
      log: ${{ steps.generate.outputs.log }}
    steps:
      - uses: eas/checkout
      - id: generate
        name: Generate git log
        run: |
          LOG=$(git log --format="• %s" $(git merge-base HEAD origin/develop)..HEAD --no-merges | head -20)
          set-output log "$LOG"

  notify_native_success:
    name: ✅ Notify — Native Build Distributed
    type: slack
    needs: [changelog]
    after: [submit_ios_fresh, submit_android_fresh, distribute_ios_reuse, distribute_android_reuse, publish_ota]
    if: ${{ (after.submit_ios_fresh.status == 'success' || after.distribute_ios_reuse.status == 'success') && (after.submit_android_fresh.status == 'success' || after.distribute_android_reuse.status == 'success') }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "✅ Snipe IT Mobile — TestFlight / Beta"
          - type: section
            fields:
              - type: mrkdwn
                text: "🔨 *Type:* Native Build"
              - type: mrkdwn
                text: "🌿 *Branch:* testflight"
          - type: section
            text:
              type: mrkdwn
              text: "📋 *Changes*\n${{ needs.changelog.outputs.log }}"

  notify_ota_success:
    name: ✅ Notify — OTA Update Published
    type: slack
    needs: [changelog]
    after: [submit_ios_fresh, submit_android_fresh, distribute_ios_reuse, distribute_android_reuse, publish_ota]
    if: ${{ after.publish_ota.status == 'success' && after.submit_ios_fresh.status != 'success' && after.distribute_ios_reuse.status != 'success' }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "✅ Snipe IT Mobile — TestFlight / Beta"
          - type: section
            fields:
              - type: mrkdwn
                text: "⚡ *Type:* OTA / JS Update"
              - type: mrkdwn
                text: "🌿 *Branch:* testflight"
          - type: section
            text:
              type: mrkdwn
              text: "📋 *Changes*\n${{ needs.changelog.outputs.log }}"

  notify_failure:
    name: ❌ Notify — Failure
    type: slack
    after: [build_ios, build_android, submit_ios_fresh, submit_android_fresh, distribute_ios_reuse, distribute_android_reuse, publish_ota]
    if: ${{ failure() }}
    params:
      webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
      payload:
        blocks:
          - type: header
            text:
              type: plain_text
              text: "❌ Snipe IT Mobile — TestFlight Failed"
          - type: section
            fields:
              - type: mrkdwn
                text: "🌿 *Branch:* testflight"
          - type: section
            text:
              type: mrkdwn
              text: "📊 *Job Status*\n🍎 iOS build: ${{ after.build_ios.status }} | submit: ${{ after.submit_ios_fresh.status }} | reuse: ${{ after.distribute_ios_reuse.status }}\n🤖 Android build: ${{ after.build_android.status }} | submit: ${{ after.submit_android_fresh.status }} | reuse: ${{ after.distribute_android_reuse.status }}\n⚡ OTA: ${{ after.publish_ota.status }}"
          - type: section
            text:
              type: mrkdwn
              text: "🔗 Check the EAS dashboard for details."
