name: testflight-build-submit

on:
  push:
    branches:
      - testflight

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  # Same computation as develop.yml. testflight only ever holds commits fast-forwarded from
  # develop, so the first-parent count, and the release number, match develop's run.
  release_info:
    name: Compute Release Number
    runs_on: linux-medium
    outputs:
      release_number: ${{ steps.release.outputs.release_number }}
      commit: ${{ steps.release.outputs.commit }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: eas/checkout
      - id: release
        name: Count first-parent commits
        run: |
          # eas/checkout clones with --depth 1, which would make the count 1. The tags are for
          # the notes step, which starts from the previous release tag.
          git fetch --unshallow --tags --quiet
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Checkout is still shallow; the release number would be wrong." >&2
            exit 1
          fi
          MAJOR_MINOR=$(node -p "require('./app.json').expo.version.split('.').slice(0, 2).join('.')")
          COUNT=$(git rev-list --count --first-parent HEAD)
          set-output release_number "$MAJOR_MINOR.$COUNT"
          set-output commit "$(git rev-parse --short HEAD)"
      - id: notes
        name: List the PRs since the previous release
        run: set-output notes "$(node scripts/release-notes.mjs "${{ steps.release.outputs.release_number }}")"

  # Only a beta-profile build counts. A develop build with the same fingerprint listens on the
  # `internal-testing` channel, so beta testers who received it would get develop's updates
  # instead of this branch's. A beta build that matches is already on TestFlight and open
  # testing, so there is nothing to distribute.
  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: beta
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Beta)
    type: build
    needs: [get_build_ios, release_info]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    # Inlined into the embedded bundle, as on develop.
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: ios
      profile: beta

  build_android:
    name: Build Android (Beta)
    type: build
    needs: [get_build_android, release_info]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    env:
      EXPO_PUBLIC_RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      EXPO_PUBLIC_UPDATE_COMMIT: ${{ needs.release_info.outputs.commit }}
    params:
      platform: android
      profile: beta

  # iOS uses type: testflight rather than type: submit because only the testflight job can
  # create the Beta App Review submission. "Initial Group" is an external group, and an
  # external group's first build on each version has to clear that review, so type: submit
  # left the build sitting at "Ready to Submit" and testers never received it.
  distribute_ios:
    name: Distribute iOS to Initial Group
    type: testflight
    needs: [build_ios, release_info]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: beta
      external_groups: ["Initial Group"]
      submit_beta_review: true
      changelog: ${{ needs.release_info.outputs.notes }}

  submit_android:
    name: Submit Android (Beta)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: beta

  # Serves beta the update develop already published for this commit instead of exporting a
  # new one: same bundle, same EXPO_PUBLIC_* values, same gitCommitHash, so testers run the
  # bytes internal testers ran. The source maps develop uploaded match it by debug ID, so
  # there is nothing to upload here.
  promote_update:
    name: Republish develop's update (beta)
    needs: [release_info]
    environment: production
    env:
      RELEASE_NUMBER: ${{ needs.release_info.outputs.release_number }}
      COMMIT: ${{ needs.release_info.outputs.commit }}
      COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      # eas-cli resolves the app config, and its plugins, before any command that reads the project.
      - uses: eas/install_node_modules
      - name: Republish the update groups develop published for this commit
        run: |
          set -euo pipefail
          MESSAGE="$RELEASE_NUMBER ($COMMIT)"
          # update:list shows each message as "\"<message>\" (<age> by <actor>)" and has no commit
          # field, so it only narrows the candidates. update:view reports gitCommitHash, which
          # confirms them. The list is newest first, so a re-run of develop wins.
          CANDIDATE_GROUPS=$(npx eas-cli@latest update:list --branch develop --limit 50 --json \
            | jq -r --arg prefix "\"$MESSAGE\"" '.currentPage[] | select(.message | startswith($prefix)) | .group')
          GROUPS_TO_REPUBLISH=""
          COVERED_PLATFORMS=" "
          for GROUP in $CANDIDATE_GROUPS; do
            GROUP_UPDATES=$(npx eas-cli@latest update:view "$GROUP" --json)
            if ! echo "$GROUP_UPDATES" | jq -e --arg hash "$COMMIT_HASH" 'all(.gitCommitHash == $hash)' > /dev/null; then
              continue
            fi
            for PLATFORM in $(echo "$GROUP_UPDATES" | jq -r '.[].platform'); do
              case "$COVERED_PLATFORMS" in
                *" $PLATFORM "*) ;;
                *)
                  COVERED_PLATFORMS="$COVERED_PLATFORMS$PLATFORM "
                  case " $GROUPS_TO_REPUBLISH " in *" $GROUP "*) ;; *) GROUPS_TO_REPUBLISH="$GROUPS_TO_REPUBLISH $GROUP" ;; esac
                  ;;
              esac
            done
          done
          # Checked before republishing anything, so a missing platform doesn't leave beta
          # with only half of the release.
          for PLATFORM in ios android; do
            case "$COVERED_PLATFORMS" in
              *" $PLATFORM "*) ;;
              *)
                echo "develop has no $PLATFORM update for $COMMIT_HASH with the message \"$MESSAGE\"." >&2
                echo "Only commits that passed develop can be promoted; a hotfix commit needs a fresh export, which this workflow doesn't do yet." >&2
                exit 1
                ;;
            esac
          done
          for GROUP in $GROUPS_TO_REPUBLISH; do
            echo "Republishing $GROUP to ${{ github.ref_name }}"
            npx eas-cli@latest update:republish --group "$GROUP" --destination-branch ${{ github.ref_name }} --message "$MESSAGE" --non-interactive
          done

  update_deployments_gist:
    name: Update Deployments Gist
    runs_on: linux-medium
    after: [build_ios, build_android, distribute_ios, submit_android, promote_update]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      # eas-cli resolves the app config, and its plugins, before any command that reads the project.
      - uses: eas/install_node_modules
      - name: Rewrite the deployments table
        run: WORKFLOW_NAME=testflight-build-submit node scripts/update-deployments-gist.mjs

  notify_native_success:
    name: ✅ Notify — Native Build Distributed
    runs_on: linux-medium
    after: [distribute_ios, submit_android, promote_update]
    if: ${{ after.distribute_ios.status == 'success' && after.submit_android.status == 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          CHANGELOG=$(git log --format="• %s" --no-merges -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="_No new commits_"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg changelog "$CHANGELOG" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — TestFlight / Beta"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "🔨 *Type:* Native Build"},
                  {type: "mrkdwn", text: "🌿 *Branch:* testflight"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Changes*\n" + $changelog)}}
              ]}')"

  notify_ota_success:
    name: ✅ Notify — OTA Update Published
    runs_on: linux-medium
    after: [distribute_ios, submit_android, promote_update]
    if: ${{ after.promote_update.status == 'success' && after.distribute_ios.status != 'success' }}
    steps:
      - uses: eas/checkout
      - name: Send Slack notification
        run: |
          CHANGELOG=$(git log --format="• %s" --no-merges -20)
          [ -z "$CHANGELOG" ] && CHANGELOG="_No new commits_"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg changelog "$CHANGELOG" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "✅ Snipe IT Mobile — TestFlight / Beta"}},
                {type: "section", fields: [
                  {type: "mrkdwn", text: "⚡ *Type:* OTA / JS Update"},
                  {type: "mrkdwn", text: "🌿 *Branch:* testflight"}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("📋 *Changes*\n" + $changelog)}}
              ]}')"

  notify_failure:
    name: ❌ Notify — Failure
    runs_on: linux-medium
    after: [release_info, build_ios, build_android, distribute_ios, submit_android, promote_update]
    if: ${{ failure() }}
    steps:
      - name: Send Slack notification
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg ios_build "${{ after.build_ios.status }}" \
              --arg ios_submit "${{ after.distribute_ios.status }}" \
              --arg android_build "${{ after.build_android.status }}" \
              --arg android_submit "${{ after.submit_android.status }}" \
              --arg ota "${{ after.promote_update.status }}" \
              '{blocks: [
                {type: "header", text: {type: "plain_text", text: "❌ Snipe IT Mobile — TestFlight Failed"}},
                {type: "section", fields: [{type: "mrkdwn", text: "🌿 *Branch:* testflight"}]},
                {type: "section", text: {type: "mrkdwn", text: ("📊 *Job Status*\n🍎 iOS build: " + $ios_build + " | submit: " + $ios_submit + "\n🤖 Android build: " + $android_build + " | submit: " + $android_submit + "\n⚡ OTA: " + $ota)}},
                {type: "section", text: {type: "mrkdwn", text: "🔗 Check the EAS dashboard for details."}}
              ]}')"
