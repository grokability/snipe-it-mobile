name: main-build

on:
  push:
    branches:
      - main

jobs:
  fingerprint:
    name: Calculate Fingerprints
    type: fingerprint

  get_build_ios:
    name: Find Existing iOS Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  get_build_android:
    name: Find Existing Android Build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_ios:
    name: Build iOS (Production)
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android (Production)
    type: build
    needs: [get_build_android]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: production

  publish_ota:
    name: Publish OTA Update (production)
    needs: [get_build_ios, get_build_android]
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Publish update
        run: npx eas-cli@latest update --auto --channel production --environment production --non-interactive
