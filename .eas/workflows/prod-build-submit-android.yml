name: prod-build-submit-android

on:
  push:
    branches:
      - main

jobs:
  build_android:
    name: Build Android App
    type: build
    params:
      platform: android
  submit:
    name: Submit to Play Store
    type: submit
    needs: [ build_android ]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production